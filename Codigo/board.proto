// board.proto
syntax = "proto3";

service BoardService {
  rpc SendStroke (Stroke) returns (Ack);
  rpc StreamStrokes (User) returns (stream Stroke);
}

message User {
  string user_id = 1;
}

message Stroke {
  string user_id = 1;
  int32 x = 2;
  int32 y = 3;
  string color = 4;
  int32 size = 5;
}

message Ack {
  string message = 1;
}
